<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1180"
    height="610"
    viewBox="0 0 1180 610"
    fill="none"
    role="img"
    aria-labelledby="title desc">

    <title id="title">Bruno Lucas - GitHub Profile Header</title>
    <desc id="desc">
        Animated premium SVG header with glassmorphism, terminal,
        profile panel and animated gradients.
    </desc>

    <!-- ===================================================== -->
    <!-- DEFINITIONS                                            -->
    <!-- ===================================================== -->

    <defs>

        <!-- ===================== -->
        <!-- BACKGROUND GRADIENTS   -->
        <!-- ===================== -->

        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="0%" stop-color="#05070B">
                <animate
                    attributeName="stop-color"
                    values="#05070B;#08111D;#05070B"
                    dur="16s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="50%" stop-color="#0B1220">
                <animate
                    attributeName="stop-color"
                    values="#0B1220;#111827;#0B1220"
                    dur="16s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="100%" stop-color="#06080F">
                <animate
                    attributeName="stop-color"
                    values="#06080F;#0A1320;#06080F"
                    dur="16s"
                    repeatCount="indefinite"/>
            </stop>

        </linearGradient>

        <!-- ===================== -->
        <!-- AURORA                 -->
        <!-- ===================== -->

        <radialGradient id="auroraBlue">

            <stop offset="0%" stop-color="#3B82F6" stop-opacity=".45"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>

        </radialGradient>

        <radialGradient id="auroraPurple">

            <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".32"/>
            <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>

        </radialGradient>

        <radialGradient id="auroraCyan">

            <stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/>
            <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>

        </radialGradient>

        <!-- ===================== -->
        <!-- GLASS                  -->
        <!-- ===================== -->

        <linearGradient id="glassGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

            <stop offset="0%"
                  stop-color="#FFFFFF"
                  stop-opacity=".10"/>

            <stop offset="50%"
                  stop-color="#FFFFFF"
                  stop-opacity=".035"/>

            <stop offset="100%"
                  stop-color="#FFFFFF"
                  stop-opacity=".08"/>

        </linearGradient>

        <!-- ===================== -->
        <!-- BORDER SHIMMER         -->
        <!-- ===================== -->

        <linearGradient id="borderGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="0%">

            <stop offset="0%"
                  stop-color="#FFFFFF"
                  stop-opacity=".10"/>

            <stop offset="25%"
                  stop-color="#6EE7F9"
                  stop-opacity=".95">

                <animate
                    attributeName="offset"
                    values="-1;1"
                    dur="5s"
                    repeatCount="indefinite"/>

            </stop>

            <stop offset="50%"
                  stop-color="#A855F7"
                  stop-opacity=".80">

                <animate
                    attributeName="offset"
                    values="0;2"
                    dur="5s"
                    repeatCount="indefinite"/>

            </stop>

            <stop offset="100%"
                  stop-color="#FFFFFF"
                  stop-opacity=".10"/>

        </linearGradient>

        <!-- ===================== -->
        <!-- REFLECTION             -->
        <!-- ===================== -->

        <linearGradient id="reflectionGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

            <stop offset="0%"
                  stop-color="#FFFFFF"
                  stop-opacity=".22"/>

            <stop offset="30%"
                  stop-color="#FFFFFF"
                  stop-opacity=".05"/>

            <stop offset="100%"
                  stop-color="#FFFFFF"
                  stop-opacity="0"/>

        </linearGradient>

        <!-- ===================== -->
        <!-- SCANLINE               -->
        <!-- ===================== -->

        <pattern id="scanlines"
                 width="4"
                 height="4"
                 patternUnits="userSpaceOnUse">

            <rect
                width="4"
                height="2"
                fill="#FFFFFF"
                opacity=".018"/>

        </pattern>

        <!-- ===================== -->
        <!-- SHADOW                 -->
        <!-- ===================== -->

        <filter id="shadow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="20"
                flood-color="#000000"
                flood-opacity=".45"/>

        </filter>

        <!-- ===================== -->
        <!-- BLUE GLOW              -->
        <!-- ===================== -->

        <filter id="blueGlow"
                x="-80%"
                y="-80%"
                width="260%"
                height="260%">

            <feGaussianBlur
                stdDeviation="12"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

        <!-- ===================== -->
        <!-- SOFT BLUR              -->
        <!-- ===================== -->

        <filter id="softBlur"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%">

            <feGaussianBlur stdDeviation="40"/>

        </filter>

    </defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND                                             -->
    <!-- ===================================================== -->

    <rect
        width="1180"
        height="610"
        fill="url(#bgGradient)"/>

    <!-- Aurora 1 -->

    <circle
        cx="210"
        cy="120"
        r="250"
        fill="url(#auroraBlue)"
        filter="url(#softBlur)">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="-20 -10;25 18;-20 -10"
            dur="18s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Aurora 2 -->

    <circle
        cx="920"
        cy="150"
        r="220"
        fill="url(#auroraPurple)"
        filter="url(#softBlur)">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="30 -15;-35 18;30 -15"
            dur="20s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Aurora 3 -->

    <circle
        cx="610"
        cy="520"
        r="280"
        fill="url(#auroraCyan)"
        filter="url(#softBlur)">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="-18 15;18 -20;-18 15"
            dur="22s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Scanline -->

    <rect
        width="1180"
        height="610"
        fill="url(#scanlines)"
        opacity=".35"/>

    <!-- ===================================================== -->
    <!-- MAIN GLASS CONTAINER                                   -->
    <!-- ===================================================== -->

    <g filter="url(#shadow)">

        <rect
            x="35"
            y="35"
            rx="34"
            ry="34"
            width="1110"
            height="540"
            fill="url(#glassGradient)"
            stroke="url(#borderGradient)"
            stroke-width="1.4"/>

        <!-- Reflection -->

        <path
            d="M60 55
               L500 55
               L300 575
               L60 575Z"
            fill="url(#reflectionGradient)"
            opacity=".22"/>

    </g>

    <!-- ===================================================== -->
    <!-- CONTINUA NA PARTE 2                                   -->
    <!-- ===================================================== -->
