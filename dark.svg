      <g opacity="0"><animate attributeName="opacity" to="1" begin="2.9s" dur="0.3s" fill="freeze"/>
        <rect x="755" y="480" width="60" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C3AED" stroke-opacity="0.5" filter="url(#glow)">
          <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="2.7s" repeatCount="indefinite"/>
