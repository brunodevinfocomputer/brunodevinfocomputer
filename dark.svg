        <circle cx="558" cy="558" r="18" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#glow)"/>
        <text x="558" y="563" text-anchor="middle">in</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
        <circle cx="618" cy="558" r="18" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#glow)"/>
        <text x="618" y="563" text-anchor="middle">X</text>
