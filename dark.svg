    <line x1="480" y1="530" x2="1120" y2="530" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <g font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="3.2s" dur="0.4s" fill="freeze"/>
        <circle cx="498" cy="558" r="18" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#glow)"/>
