        <rect x="825" y="480" width="80" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.5" filter="url(#glow)">
          <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="3.0s" repeatCount="indefinite"/>
        </rect>
